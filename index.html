<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Snake | Deshan Siriwardhana</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --cyan: #00d4ff;
            --purple: #7c3aed;
            --text: #e6edf3;
            --muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: radial-gradient(circle at top, #111827, var(--bg));
            color: var(--text);
            font-family: 'Fira Code', ui-monospace, Menlo, Consolas, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 16px;
            touch-action: none;
            user-select: none;
        }

        h1 {
            font-size: 22px;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .bar {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: var(--muted);
        }

        .bar b {
            color: var(--cyan);
        }

        .wrap {
            position: relative;
            border: 2px solid var(--cyan);
            border-radius: 12px;
            box-shadow: 0 0 24px rgba(0, 212, 255, .35);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: var(--panel);
            width: min(90vw, 420px);
            height: min(90vw, 420px);
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(13, 17, 23, .85);
            text-align: center;
        }

        .overlay h2 {
            font-size: 20px;
            color: var(--cyan);
        }

        .overlay p {
            font-size: 12px;
            color: var(--muted);
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            padding: 10px 20px;
            color: #fff;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
        }

        .pad {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(2, 56px);
            gap: 8px;
        }

        .pad button {
            padding: 0;
            font-size: 20px;
            background: var(--panel);
            border: 1px solid #30363d;
            color: var(--cyan);
        }

        .pad .up {
            grid-column: 2;
        }

        .pad .l {
            grid-row: 2;
            grid-column: 1;
        }

        .pad .d {
            grid-row: 2;
            grid-column: 2;
        }

        .pad .r {
            grid-row: 2;
            grid-column: 3;
        }

        @media (hover:hover) and (pointer:fine) {
            .pad {
                display: none;
            }
        }

        a {
            color: var(--muted);
            font-size: 12px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h1>🐍 SNAKE</h1>
    <div class="bar"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
    <div class="wrap">
        <canvas id="c" width="420" height="420"></canvas>
        <div class="overlay" id="ov">
            <h2 id="ovTitle">Ready?</h2>
            <p id="ovMsg">Arrow keys / WASD or swipe · Space to pause</p>
            <button id="start">▶ Play</button>
        </div>
    </div>
    <div class="pad">
        <button class="up" data-d="U">▲</button>
        <button class="l" data-d="L">◀</button>
        <button class="d" data-d="D">▼</button>
        <button class="r" data-d="R">▶</button>
    </div>
    <a href="https://github.com/deshan2004">← Back to GitHub profile</a>

    <script>
        const cv = document.getElementById('c'), ctx = cv.getContext('2d');
        const N = 21, S = cv.width / N;
        const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
        const ov = document.getElementById('ov'), ovTitle = document.getElementById('ovTitle'), ovMsg = document.getElementById('ovMsg');
        let snake, dir, nextDir, food, score, best = 0, timer, running = false, paused = false, speed;

        try { best = +localStorage.getItem('snakeBest') || 0; } catch (e) { }
        bestEl.textContent = best;

        function reset() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            dir = nextDir = { x: 1, y: 0 };
            score = 0; speed = 130; scoreEl.textContent = 0;
            placeFood();
        }
        function placeFood() {
            do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
            while (snake.some(s => s.x === food.x && s.y === food.y));
        }
        function start() {
            reset(); running = true; paused = false; ov.style.display = 'none';
            clearInterval(timer); timer = setInterval(tick, speed);
        }
        function restartTimer() { clearInterval(timer); timer = setInterval(tick, speed); }
        function tick() {
            dir = nextDir;
            const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
            if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) return gameOver();
            snake.unshift(h);
            if (h.x === food.x && h.y === food.y) {
                score++; scoreEl.textContent = score;
                if (speed > 60 && score % 3 === 0) { speed -= 8; restartTimer(); }
                placeFood();
            } else snake.pop();
            draw();
        }
        function gameOver() {
            running = false; clearInterval(timer);
            if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('snakeBest', best); } catch (e) { } }
            ovTitle.textContent = 'Game Over'; ovMsg.textContent = 'Score: ' + score + (score && score === best ? ' 🏆 New best!' : '');
            document.getElementById('start').textContent = '↻ Play again';
            ov.style.display = 'flex';
        }
        function draw() {
            ctx.fillStyle = '#161b22'; ctx.fillRect(0, 0, cv.width, cv.height);
            ctx.strokeStyle = 'rgba(48,54,61,.5)';
            for (let i = 1; i < N; i++) { ctx.beginPath(); ctx.moveTo(i * S, 0); ctx.lineTo(i * S, cv.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * S); ctx.lineTo(cv.width, i * S); ctx.stroke(); }
            ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 12; ctx.fillStyle = '#ff4d6d';
            ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 3, 0, Math.PI * 2); ctx.fill();
            ctx.shadowColor = '#00d4ff';
            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#7c3aed' : '#00d4ff'; ctx.shadowBlur = i === 0 ? 14 : 6;
                ctx.beginPath(); ctx.roundRect(s.x * S + 2, s.y * S + 2, S - 4, S - 4, 6); ctx.fill();
            });
            ctx.shadowBlur = 0;
        }
        function turn(d) {
            const m = { U: { x: 0, y: -1 }, D: { x: 0, y: 1 }, L: { x: -1, y: 0 }, R: { x: 1, y: 0 } }[d];
            if (m && !(m.x === -dir.x && m.y === -dir.y)) nextDir = m;
        }
        document.addEventListener('keydown', e => {
            const k = { ArrowUp: 'U', w: 'U', W: 'U', ArrowDown: 'D', s: 'D', S: 'D', ArrowLeft: 'L', a: 'L', A: 'L', ArrowRight: 'R', d: 'R', D: 'R' }[e.key];
            if (k) { e.preventDefault(); turn(k); }
            if (e.code === 'Space') {
                e.preventDefault();
                if (!running) return start();
                paused = !paused;
                if (paused) { clearInterval(timer); ovTitle.textContent = 'Paused'; ovMsg.textContent = 'Press Space to resume'; document.getElementById('start').style.display = 'none'; ov.style.display = 'flex'; }
                else { ov.style.display = 'none'; document.getElementById('start').style.display = ''; restartTimer(); }
            }
        });
        document.getElementById('start').onclick = start;
        document.querySelectorAll('.pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.d); }));
        let tx, ty;
        cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
        cv.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
            turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
        });
        reset(); draw();
    </script>
</body>

</html>
