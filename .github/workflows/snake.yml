name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: deshan2004
          outputs: |
            dist/github-snake.svg?color_snake=#00D4FF&color_dots=#ebedf0,#90e0ef,#00b4d8,#0077b6,#03045e
            dist/github-snake-dark.svg?color_snake=#00D4FF&color_dots=#161b22,#03045e,#0077b6,#00b4d8,#00d4ff

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
